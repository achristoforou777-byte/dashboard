/* VOICE: a private command centre: quiet, premium, nocturnal.
   IDEA: frosted-glass instruments floating over a warm, blurred room at night.
   PICTURE: glass cards (KPIs with sparklines, cash-flow chart, project pipeline) over a glowing ambient scene or the owner's own photo.
   COLOUR and TYPE: near-black warm ground, ember orange accent, mint for money in; Plus Jakarta Sans.
   LAYOUT: glass sidebar + top bar on Mac; glass tab bar + orange add button on the phone; one dark palette in both themes. */
:root{color-scheme:dark;--ink:#f6f1ec;--mute:rgba(246,241,236,.72);--dim:rgba(246,241,236,.52);--line:rgba(255,255,255,.09);--edge:rgba(255,255,255,.15);--hi:rgba(255,255,255,.24);--acc:#ff6a3d;--acc2:#ff9b54;--good:#62e3ae;--bad:#ff8170;--r:22px}
*{box-sizing:border-box;min-width:0}
html{background:#0d0b0a}
body{margin:0;color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0d0b0a center/cover no-repeat}
.scene i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.scene i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(#ff6a3d,transparent 65%)}
.scene i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:5vmax;background:radial-gradient(#b8763a,transparent 65%);opacity:.55}
.scene i:nth-child(3){width:50vmax;height:50vmax;right:5vmax;bottom:-28vmax;background:radial-gradient(#245a5e,transparent 65%);opacity:.6}
.scene i:nth-child(4){width:34vmax;height:34vmax;left:18vmax;bottom:-12vmax;background:radial-gradient(#5b2440,transparent 65%);opacity:.55}
.scene.photo i{display:none}.scene.photo::after{content:"";position:absolute;inset:0;background:rgba(10,8,7,.35)}
@media(prefers-reduced-motion:no-preference){.scene i{animation:drift 26s ease-in-out infinite alternate}.scene i:nth-child(2){animation-duration:32s}.scene i:nth-child(3){animation-duration:38s}
 @keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}}
.glass{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.15),rgba(255,255,255,.075) 45%,rgba(255,255,255,.10));backdrop-filter:blur(72px) saturate(170%);-webkit-backdrop-filter:blur(72px) saturate(170%);border:1px solid var(--edge);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 24px 60px -24px rgba(0,0,0,.7)}

.chk:hover{border-color:var(--acc)}.done .chk{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent}

 <div class="me"><span class="av">ΑΧ</span><div>Ανδρέας Χριστοφόρου<small><button class="tt" style="padding:0;color:var(--dim);font-size:12px" data-act="settings">Ρυθμίσεις</button></small></div></div>
</aside>
<div>
 <div class="top glass"><div><h1 id="ttl">Επισκόπηση</h1><p id="tsub"></p></div>
  <label class="search" aria-label="Αναζήτηση"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg><input id="q" placeholder="Αναζήτηση…" autocomplete="off"></label>
  <button class="avbtn" data-act="settings" aria-label="Ρυθμίσεις"><span class="av">ΑΧ</span></button><button class="cta" data-act="add"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6"><path d="M12 5v14M5 12h14"/></svg>Νέα καταχώρηση</button></div>

<script src="data.js?v=8"></script>
<script>
{
const $=id=>document.getElementById(id),app=$('app'),dlg=$('dlg'),msg=$('msg');
const S={projects:[],tasks:[],tx:[],notes:[],rec:[],all:[],month:null,tf:'all',mf:'all',q:'',ready:false};
const COLS=['projects','tasks','tx','notes','rec'];let db=null,F=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),addDays=(s,n)=>{const d=new Date(s+'T12:00');d.setDate(d.getDate()+n);return iso(d)};
const eur=n=>new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR',minimumFractionDigits:Number.isInteger(+n||0)?0:2,maximumFractionDigits:2}).format(n||0);
const short=n=>Math.abs(n)>=10000?new Intl.NumberFormat('el-GR',{style:'currency',currency:'EUR',notation:'compact',maximumFractionDigits:1}).format(n):eur(n);
const fmtD=s=>s?new Date(s+'T12:00').toLocaleDateString('el-GR',{day:'numeric',month:'short'}):'';
const mName=(m,o={month:'long',year:'numeric'})=>new Date(m+'-15T12:00').toLocaleDateString('el-GR',o);
const mShift=(m,n)=>{const d=new Date(m+'-15T12:00');d.setMonth(d.getMonth()+n);return iso(d).slice(0,7)};
S.month=today().slice(0,7);
const STATUS={active:'Ενεργό',waiting:'Σε αναμονή',idea:'Ιδέα'},ORDER={active:0,waiting:1,idea:2};
const PAL=['#ff8a4c','#ffc75f','#62e3ae','#8fb5ff','#d49bff','#ff8fb3','#6fd6ff'];
const color=id=>{let h=0;for(const c of String(id))h=(h*31+c.charCodeAt(0))>>>0;return PAL[h%PAL.length]};
const initials=s=>String(s||'').trim().split(/\s+/).map(w=>w[0]).join('').slice(0,2).toUpperCase();
const proj=id=>S.projects.find(p=>p.id===id),pname=id=>proj(id)?.name||'Χωρίς project';
const projs=()=>[...S.projects].sort((a,b)=>(ORDER[a.status]??3)-(ORDER[b.status]??3)||String(a.name).localeCompare(b.name,'el'));
const pShare=p=>p?(p.share??(p.partner?50:100)):100,txShare=x=>x.share??pShare(proj(x.project)),mine=x=>(+x.amount||0)*txShare(x)/100;
const sumMine=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+mine(x),0);
const TYPES=[['invest','Επένδυση'],['out','Έξοδο'],['in','Έσοδο'],['return','Επιστροφή'],['settle','Εξόφληση']];
const THINT={invest:'Λεφτά από την τσέπη σου που βάζεις στο project. Μετράνε στο «Έβαλα».',out:'Πληρωμή για το project. Αν την πλήρωσες εσύ, μετράει και στο «Έβαλα».',in:'Λεφτά που έβγαλε το project. Αν τα εισέπραξες εσύ, μετράνε και στο «Πήρα πίσω».',return:'Λεφτά που σου επιστρέφει το project (κεφάλαιο ή μέρισμα). Μετράνε στο «Πήρα πίσω».',settle:'Ξεκαθάρισμα με τον συνεργάτη. Δεν μετράει σε έσοδα/έξοδα του project.'};
const putAmt=x=>(x.type==='invest'||(x.type==='out'&&x.by==='me')||(x.type==='settle'&&x.dir==='out'))?(+x.amount||0):0;
const gotAmt=x=>(x.type==='return'||(x.type==='in'&&x.by==='me')||(x.type==='settle'&&x.dir==='in'))?(+x.amount||0):0;
function position(pid,until){const end=until||today(),l=S.all.filter(x=>(!pid||x.project===pid)&&(x.date||'')<=end);
 const put=l.reduce((a,x)=>a+putAmt(x),0),got=l.reduce((a,x)=>a+gotAmt(x),0);
 return{put,got,net:got-put,pl:sum(l,'in')-sum(l,'out'),mineP:sumMine(l,'in')-sumMine(l,'out')}}
function upcoming(days=30){const t=today(),lim=addDays(t,days),out=[],isOut=x=>x.type==='out'||x.type==='invest'||(x.type==='settle'&&x.dir==='out');
 S.tx.filter(x=>isOut(x)&&x.date>t&&x.date<=lim).forEach(x=>out.push(x));
 S.rec.filter(isOut).forEach(r=>{if(!r.start)return;const day=+r.start.slice(8,10)||1;for(let k=0;k<3;k++){const m=mShift(t.slice(0,7),k),dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),d=m+'-'+String(Math.min(day,dim)).padStart(2,'0');
  if(d>t&&d<=lim&&d>=r.start&&(!r.end||m<=r.end))out.push({...r,id:'r~'+r.id+'~'+m,rid:r.id,date:d})}});
 return out.sort((a,b)=>a.date.localeCompare(b.date))}
const sum=(l,t)=>l.filter(x=>x.type===t).reduce((a,x)=>a+(+x.amount||0),0);
function expand(){const out=[],now=today().slice(0,7);
 for(const r of S.rec){if(!r.start)continue;let m=r.start.slice(0,7);const day=+r.start.slice(8,10)||1,last=r.end&&r.end<now?r.end:now;let g=0;
  while(m<=last&&g++<240){const dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate();out.push({...r,id:'r~'+r.id+'~'+m,rid:r.id,date:m+'-'+String(Math.min(day,dim)).padStart(2,'0')});m=mShift(m,1)}}
 return out}
const recon=()=>{S.all=[...S.tx,...expand()]};
const sgn=n=>n>0?'pos':n<0?'neg':'';
const empty=t=>`<p class="empty">${t}</p>`;
const byDue=(a,b)=>(a.due||'9999').localeCompare(b.due||'9999')||(b.prio==='high')-(a.prio==='high');
const I={home:'<path d="M3 11 12 4l9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',proj:'<rect x="3" y="4" width="5" height="16" rx="1.5"/><rect x="10" y="4" width="5" height="11" rx="1.5"/><rect x="17" y="4" width="4" height="7" rx="1.5"/>',task:'<rect x="3.5" y="3.5" width="17" height="17" rx="4"/><path d="m8 12 3 3 5-6"/>',money:'<rect x="2.5" y="6" width="19" height="13" rx="3"/><path d="M2.5 10h19M16 15h2"/>',up:'<path d="M7 17 17 7M9 7h8v8"/>',down:'<path d="M17 7 7 17M15 17H7V9"/>'};
const ico=(k,sw=1.9)=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="${sw}" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`;
const NAV=[['home','Χαρτοφυλάκιο','home'],['projects','Projects','proj'],['tasks','Tasks','task'],['money','Χρήματα','money']];
const months=n=>Array.from({length:n},(_,i)=>mShift(today().slice(0,7),i-n+1));
const mTot=(m,pid)=>{const l=S.all.filter(x=>(x.date||'').startsWith(m)&&(!pid||x.project===pid));return{i:sum(l,'in'),o:sum(l,'out')}};
function spark(vals,col){const mx=Math.max(...vals),mn=Math.min(...vals),r=mx-mn||1;const pts=vals.map((v,i)=>`${(i/(vals.length-1)*100).toFixed(1)},${(28-(v-mn)/r*24).toFixed(1)}`).join(' ');
 return `<svg class="spark" viewBox="0 0 100 30" preserveAspectRatio="none"><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linecap="round" stroke-linejoin="round"/></svg>`}
function ring(p){const c=2*Math.PI*22;return `<svg width="58" height="58" viewBox="0 0 58 58"><circle cx="29" cy="29" r="22" fill="none" stroke="rgba(255,255,255,.1)" stroke-width="6"/><circle cx="29" cy="29" r="22" fill="none" stroke="url(#rg)" stroke-width="6" stroke-linecap="round" stroke-dasharray="${c*p} ${c}" transform="rotate(-90 29 29)"/><defs><linearGradient id="rg"><stop offset="0" stop-color="#ff9b54"/><stop offset="1" stop-color="#ff6a3d"/></linearGradient></defs><text x="29" y="33.5" text-anchor="middle" fill="#f6f1ec" font-size="13" font-weight="800" font-family="Plus Jakarta Sans">${Math.round(p*100)}%</text></svg>`}
const chg=(a,b)=>{if(!b)return '';const p=Math.round((a-b)/Math.abs(b)*100);return `<span class="chg ${p<0?'n':''}">${p>=0?'↑':'↓'} ${Math.abs(p)}%</span>`};

function taskRow(x,showP=true){
 const t=today(),late=!x.done&&x.due&&x.due<t,p=proj(x.project);
 const sub=[showP&&p?`<i class="dot" style="color:${color(p.id)};background:${color(p.id)};width:7px;height:7px"></i>${esc(p.name)}`:'',x.due?(late?'Έπρεπε ':'')+fmtD(x.due):''].filter(Boolean).join(' · ');
 return `<div class="task ${x.done?'done':''} ${late?'late':''}"><button class="chk" data-act="toggle" data-id="${esc(x.id)}" aria-label="Ολοκληρώθηκε"></button>
 <button class="tt" data-act="edit" data-kind="task" data-id="${esc(x.id)}"><span>${esc(x.title)}${x.prio==='high'?'<b class="pri">Υψηλή</b>':''}</span>${sub?`<small>${sub}</small>`:''}</button></div>`}
const tgroup=(t,l,showP=true)=>l.length?`<div class="grp">${t} · ${l.length}</div>${l.sort(byDue).map(x=>taskRow(x,showP)).join('')}`:'';
function txRow(x,showP=true){
 if(x.type==='settle'){const pn=esc(proj(x.project)?.partner||'συνεργάτης');return `<button class="row" data-act="edit" data-kind="${x.rid?'rec':'tx'}" data-id="${esc(x.rid||x.id)}"><span class="ico" style="color:#ffc75f"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 7h13l-4-4M17 17H4l4 4"/></svg></span>
 <span>${esc(x.desc||'Εξόφληση')}<b class="pri" style="color:#ffc75f;border-color:rgba(255,199,95,.45)">εξόφληση</b><small>${[fmtD(x.date),showP?esc(pname(x.project)):'',x.dir==='out'?'εσύ → '+pn:pn+' → εσύ'].filter(Boolean).join(' · ')}</small></span>
 <span class="num" style="text-align:right;color:#ffc75f">${eur(+x.amount)}<small style="font-weight:500">δεν μετράει σε έσοδα/έξοδα</small></span></button>`}
 const pers=x.type==='invest'||x.type==='return',by=pers?'':({me:'εγώ',partner:proj(x.project)?.partner||'συνεργάτης',company:'εταιρεία'}[x.by]||''),inc=x.type==='in'||x.type==='return';
 return `<button class="row" data-act="edit" data-kind="${x.rid?'rec':'tx'}" data-id="${esc(x.rid||x.id)}"><span class="ico" style="color:${inc?'var(--good)':'var(--bad)'}">${ico(inc?'down':'up',2.2)}</span>
 <span>${esc(x.desc||x.cat||'Κίνηση')}${x.type==='invest'?'<b class="pri">επένδυση</b>':''}${x.type==='return'?'<b class="pri" style="color:var(--good);border-color:rgba(98,227,174,.45)">επιστροφή</b>':''}${x.rid?'<b class="pri" style="color:#8fb5ff;border-color:rgba(143,181,255,.45)">κάθε μήνα</b>':''}<small>${[fmtD(x.date),showP?esc(pname(x.project)):'',x.cat&&x.desc?esc(x.cat):'',by?(inc?'εισέπραξε ':'πλήρωσε ')+esc(by):''].filter(Boolean).join(' · ')}</small></span>
 <span class="num ${inc?'pos':'neg'}" style="text-align:right">${inc?'+':'−'}${eur(+x.amount)}${!pers&&txShare(x)<100?`<small style="font-weight:500">δικά σου ${eur(mine(x))}</small>`:''}</span></button>`}
function pcard(p,drag){
 const open=S.tasks.filter(t=>t.project===p.id&&!t.done).length,l=S.all.filter(t=>t.project===p.id),bal=sum(l,'in')-sum(l,'out');
 return `<a class="pcard" href="#p-${esc(p.id)}" ${drag?`draggable="true" data-pid="${esc(p.id)}"`:''}><div class="t"><i class="dot" style="color:${color(p.id)};background:${color(p.id)}"></i>${esc(p.name)}${drag?`<button class="xbtn" data-act="pdel" data-id="${esc(p.id)}" aria-label="Διαγραφή project" title="Διαγραφή"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button>`:''}</div>
 <p>${p.next?'Επόμενο: '+esc(p.next):esc(p.desc||'Χωρίς περιγραφή ακόμα')}</p>
 <div class="pmeta">${p.partner?`<span class="av mini" title="${esc(p.partner)}">${esc(initials(p.partner))}</span>`:''}<span>${open} ${open===1?'task':'tasks'}</span><button class="sharebtn ${p.share==null?'unset':''}" data-act="share" data-id="${esc(p.id)}">${p.share==null?'Όρισε το ποσοστό σου':'Εσύ '+p.share+'%'}</button><span class="num ${sgn(bal)}" style="margin-left:auto;font-weight:700" title="Σύνολο project">${bal?eur(bal):'—'}</span></div></a>`}

function vHome(){
 const t=today(),open=S.tasks.filter(x=>!x.done),over=open.filter(x=>x.due&&x.due<t),tod=open.filter(x=>x.due===t),wk=open.filter(x=>x.due>t&&x.due<=addDays(t,7)),due=over.length+tod.length+wk.length;
 const h=new Date().getHours(),T=position(),P=projs().map(p=>({p,...position(p.id)})),shown=P.filter(r=>r.put||r.got||r.pl||r.p.status==='active');
 const up=upcoming(30),upT=up.reduce((a,x)=>a+(+x.amount||0),0),upM=up.reduce((a,x)=>a+(x.type==='out'?mine(x):+x.amount||0),0);
 let tip='';const a=P.filter(r=>r.mineP>0&&r.net<0).sort((x,y)=>y.mineP-x.mineP)[0],b=P.filter(r=>r.put>0&&r.net>=0)[0],c=P.filter(r=>r.put>0).sort((x,y)=>y.put-x.put)[0];
 if(a)tip=`Η <b>${esc(a.p.name)}</b> έχει κέρδος <b>${eur(a.pl)}</b> σαν project, και το μερίδιό σου (${pShare(a.p)}%) είναι <b>${eur(a.mineP)}</b>. Μέχρι τώρα όμως έχεις πάρει πίσω <b>${eur(a.got)}</b> από τα <b>${eur(a.put)}</b> που έβαλες.`;
 else if(b)tip=`Στο <b>${esc(b.p.name)}</b> έχεις ήδη πάρει πίσω όλα όσα έβαλες${b.net>0?`, και είσαι <b>+${eur(b.net)}</b>`:''}.`;
 else if(c)tip=`Τα περισσότερα λεφτά σου είναι στο <b>${esc(c.p.name)}</b>: <b>${eur(c.put)}</b>.`;
 const lede=T.put||T.got?`Έχεις βάλει <b>${eur(T.put)}</b> στα projects σου και έχεις πάρει πίσω <b>${eur(T.got)}</b>.`:'Ξεκίνα γράφοντας τι έβαλες σε κάθε project, για να βλέπεις πού βρίσκεσαι.';
 const row=r=>{const pct=r.put?Math.min(100,r.got/r.put*100):0;
  const nx=S.tx.filter(x=>x.project===r.p.id&&x.date>today()&&putAmt(x)).sort((a,b)=>a.date.localeCompare(b.date))[0];
  const note=!r.put?(r.got?`Πήρες ${eur(r.got)} χωρίς να βάλεις`:nx?`Πρώτη πληρωμή ${fmtD(nx.date)} · ${eur(+nx.amount)}`:'Δεν έχεις βάλει λεφτά ακόμα'):r.got>=r.put?`Τα πήρες όλα πίσω ✓${r.net>0?' · +'+eur(r.net):''}`:`${Math.round(pct)}% πίσω · μένουν ${eur(r.put-r.got)}`;
  return `<a class="pos2" href="#p-${esc(r.p.id)}"><span class="nm"><b><i class="dot" style="display:inline-block;color:${color(r.p.id)};background:${color(r.p.id)};margin-right:8px"></i>${esc(r.p.name)}</b><small>Εσύ ${pShare(r.p)}% · project ${r.pl>=0?'+':''}${eur(r.pl)}</small></span>
  <span><span class="h il">Έβαλα</span><b>${eur(r.put)}</b></span><span><span class="h il">Πήρα</span><b class="${r.got?'pos':''}">${eur(r.got)}</b></span><span><span class="h il">Θέση</span><b class="${sgn(r.net)}">${r.net>0?'+':''}${eur(r.net)}</b></span>
  <span class="bar2"><span class="rec"><span style="width:${pct}%"></span></span><small>${note}</small></span></a>`};
 return `<div><div class="hello">${h<12?'Καλημέρα':'Καλησπέρα'}, Ανδρέα</div><p class="lede">${lede}</p></div>
 <section class="kpis">
 <div class="kpi glass"><div class="lab">Έβαλα συνολικά</div><strong>${eur(T.put)}</strong><small class="ks">από την τσέπη μου</small></div>
 <div class="kpi glass"><div class="lab">Πήρα πίσω</div><strong class="${T.got?'pos':''}">${eur(T.got)}</strong><small class="ks">επιστροφές &amp; εξοφλήσεις</small></div>
 <div class="kpi glass"><div class="lab">Η θέση μου</div><strong class="${sgn(T.net)}">${T.net>0?'+':''}${eur(T.net)}</strong><small class="ks">πήρα − έβαλα</small></div>
 <div class="kpi glass"><div class="lab">Μερίδιο στα κέρδη</div><strong class="${sgn(T.mineP)}">${T.mineP>0?'+':''}${eur(T.mineP)}</strong><small class="ks">αν μοιραστούν σήμερα</small></div></section>
 ${tip?`<div class="insight glass"><i>💡</i><div>${tip}</div></div>`:''}
 <section class="card glass" style="margin-bottom:16px"><div class="chead"><div><h2>Οι θέσεις μου</h2><p class="sub">Τι έβαλα και τι πήρα σε κάθε project</p></div><button class="btn" data-act="add" data-kind="tx" data-type="invest">+ Επένδυση</button></div>
 <div class="pos2 phead"><span class="h">Project</span><span class="h">Έβαλα</span><span class="h">Πήρα</span><span class="h">Θέση</span><span class="h">Πόσα πήρα πίσω</span></div>
 ${shown.map(row).join('')||empty('Δεν υπάρχουν ακόμα projects με κινήσεις.')}</section>
 <section class="grid"><div class="card glass"><div class="chead"><div><h2>Πορεία επένδυσης</h2><p class="sub">Αθροιστικά, όλα τα projects</p></div><div class="legend"><span style="--c:var(--acc)">Έβαλα</span><span style="--c:var(--good)">Πήρα πίσω</span></div></div><div class="fig" id="cum"></div></div>
 <div class="card glass"><div class="chead"><div><h2>Έρχονται πληρωμές</h2><p class="sub">Επόμενες 30 μέρες</p></div></div>
 ${up.map(x=>txRow(x)).join('')||empty('Καμία πληρωμή τις επόμενες 30 μέρες.')}${up.length?`<p class="sub" style="margin-top:10px">Σύνολο: <b>${eur(upT)}</b> · δικά σου <b>${eur(upM)}</b></p>`:''}</div></section>
 <section class="card glass"><div class="chead"><div><h2>Να γίνουν</h2><p class="sub">Καθυστερημένα, σήμερα και επόμενες 7 μέρες</p></div><button class="btn" data-act="add" data-kind="task">+ Task</button></div>
 ${tgroup('Καθυστερημένα',over)}${tgroup('Σήμερα',tod)}${tgroup('Επόμενες μέρες',wk)}${due?'':empty('Δεν υπάρχει τίποτα προγραμματισμένο. Πάτα «+ Task» για να προσθέσεις.')}</section>`}

function drawCum(){const el=$('cum');if(!el)return;const ms=months(6),t=today();
 const ser=ms.map(m=>{const d=new Date(+m.slice(0,4),+m.slice(5,7),0),end=iso(d)<t?iso(d):t,p=position(null,end);return{i:p.got,o:p.put}});
 const draw=()=>{const W=el.clientWidth,H=el.clientHeight,pl=W<480?8:52,pr=10,pt=10,pb=26;if(!W)return;
  const top=Math.max(50,...ser.map(s=>Math.max(s.i,s.o)))*1.15,x=i=>pl+i*(W-pl-pr)/(ms.length-1),y=v=>pt+(H-pt-pb)*(1-v/top);
  const path=k=>ser.map((s,i)=>`${i?'L':'M'}${x(i).toFixed(1)},${y(s[k]).toFixed(1)}`).join(''),area=k=>path(k)+`L${x(ms.length-1)},${H-pb}L${x(0)},${H-pb}Z`;

 const parts=[n('tasks')&&`${n('tasks')} ${n('tasks')===1?'task':'tasks'}`,(n('tx')+n('rec'))&&`${n('tx')+n('rec')} ${n('tx')+n('rec')===1?'κίνηση':'κινήσεις'}`,n('notes')&&`${n('notes')} ${n('notes')===1?'σημείωση':'σημειώσεις'}`].filter(Boolean);
 dlg.innerHTML=`<form class="glass" onsubmit="return false"><h2>Διαγραφή «${esc(p.name)}»;</h2><p class="sub">${parts.length?`Θα σβηστούν μαζί και ${parts.join(', ')} του project.`:'Το project δεν έχει tasks, κινήσεις ή σημειώσεις.'} Αν το μετανιώσεις, θα έχεις λίγα δευτερόλεπτα για «Αναίρεση».</p>
 <div class="fb"><button type="button" class="btn" data-act="close">Άκυρο</button><button type="button" class="btn red" style="background:rgba(255,129,112,.15)" data-act="pdelok" data-id="${esc(pid)}">Διαγραφή</button></div></form>`;
 if(!dlg.open)dlg.showModal()}
async function delProject(pid){const p=proj(pid);if(!p)return;const all=[['projects',p],...projDocs(pid)].map(([c,x])=>{const {id,...keep}=x;return [c,id,keep]});
 try{for(const [c,id] of all)await db.collection(c).doc(id).delete();if(route()==='p-'+pid)location.hash='projects';
  toast(`Το «${p.name}» διαγράφηκε`,async()=>{for(const [c,id,keep] of all)await save(c,id,keep);toast('Επαναφέρθηκε')})}catch{toast('Δεν διαγράφηκε όλο. Δοκίμασε ξανά.')}}
function openForm(kind,id,type){
 const col={tx:'tx',rec:'rec',task:'tasks',note:'notes',project:'projects'}[kind],v=(id&&S[col].find(x=>x.id===id))||{},pid=v.project||curP()||projs()[0]?.id||'';
 F={kind,id,col};let body='';
 if(kind==='tx'||kind==='rec'){const ty=v.type||type||'out',pr=proj(pid),mo=kind==='rec';
  body=`${id?'':`<div class="seg"><label><input type="radio" name="freq" value="once" ${mo?'':'checked'}><span>Μία φορά</span></label><label><input type="radio" name="freq" value="monthly" ${mo?'checked':''}><span>Κάθε μήνα</span></label></div>`}<div class="seg">${TYPES.map(([k,l])=>`<label><input type="radio" name="type" value="${k}" ${ty===k?'checked':''}><span>${l}</span></label>`).join('')}</div><p class="sub" id="thint" style="margin:-4px 0 0"></p>
  <label class="os">Ποιος έδωσε σε ποιον<select name="dir"><option value="in" ${v.dir!=='out'?'selected':''}>${esc(pr?.partner||'Ο συνεργάτης')} μου έδωσε</option><option value="out" ${v.dir==='out'?'selected':''}>Εγώ έδωσα σε ${esc(pr?.partner||'συνεργάτη')}</option></select></label>
  <div class="two"><label>Ποσό (€)<input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(v.amount??'')}" placeholder="0,00"></label><label><span id="dl">${mo?'Ξεκινά από':'Ημερομηνία'}</span><input name="date" type="date" required value="${esc((mo?v.start:v.date)||today())}"></label></div>
  <label id="endw" style="${mo?'':'display:none'}">Μέχρι (μήνας, προαιρετικό: άφησέ το κενό αν συνεχίζεται)<input name="end" type="month" value="${esc(v.end||'')}"></label>
  <div class="two"><label>Project<select name="project" id="fp">${projOpts(pid)}</select></label><label class="ns">Το ποσοστό μου (%)<input name="share" id="fs" type="number" inputmode="decimal" min="0" max="100" step="0.5" required value="${esc(v.share??pShare(pr))}"></label></div>
  <div class="mine ns" id="mine"></div>
  <label>Περιγραφή<input name="desc" value="${esc(v.desc||'')}" placeholder="π.χ. κάρβουνα για την Ορά"></label>
  <div class="two ns"><label>Κατηγορία<input name="cat" list="cats" value="${esc(v.cat||'')}" placeholder="Υλικά, Μεταφορικά…"></label><label>Ποιος πλήρωσε / εισέπραξε<select name="by"><option value="me">Εγώ</option><option value="partner" id="fpart">${esc(pr?.partner||'Συνεργάτης')}</option><option value="company">Εταιρεία</option></select></label></div>
  <datalist id="cats">${[...new Set(['Υλικά','Μεταφορικά','Marketing','Άδειες','Εξοπλισμός','Καύσιμα','Πωλήσεις','Προμήθεια',...S.tx.map(x=>x.cat).filter(Boolean)])].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
 else if(kind==='task')body=`<label>Τι πρέπει να γίνει<input name="title" required value="${esc(v.title||'')}" placeholder="π.χ. Τηλέφωνο στη bonÀrea"></label><label>Project<select name="project">${projOpts(pid)}</select></label>
  <div class="two"><label>Μέχρι<input name="due" type="date" value="${esc(v.due||'')}"></label><label>Προτεραιότητα<select name="prio"><option value="normal">Κανονική</option><option value="high" ${v.prio==='high'?'selected':''}>Υψηλή</option></select></label></div>`;
 else if(kind==='note')body=`<label>Project<select name="project">${projOpts(pid)}</select></label><label>Σημείωση<textarea name="text" rows="5" required placeholder="Τι έγινε, τι συμφωνήθηκε…">${esc(v.text||'')}</textarea></label>`;
 else body=`<label>Όνομα<input name="name" required value="${esc(v.name||'')}"></label>
  <label>Στάδιο</label><div class="seg" style="margin-top:-8px">${['idea','waiting','active'].map(k=>`<label><input type="radio" name="status" value="${k}" ${(v.status||'idea')===k?'checked':''}><span>${STATUS[k]}</span></label>`).join('')}</div>
  <div class="two"><label>Συνεργάτης<input name="partner" value="${esc(v.partner||'')}"></label><label>Το ποσοστό μου (%)<input name="share" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${esc(v.share??'')}" placeholder="π.χ. 50"></label></div><div class="two"><label>Επόμενο βήμα<input name="next" value="${esc(v.next||'')}"></label></div><label>Περιγραφή<textarea name="desc" rows="3">${esc(v.desc||'')}</textarea></label>`;
 const T={rec:['μηνιαία κίνηση','Επαναλαμβάνεται αυτόματα κάθε μήνα'],tx:['κίνηση','Έξοδο ή έσοδο για ένα project'],task:['task','Κάτι που πρέπει να γίνει'],note:['σημείωση','Ενημέρωση για την πορεία ενός project'],project:['project','Ένα νέο venture ή ιδέα']}[kind];
 const pick=!id&&kind!=='project'?`<div class="chips" style="margin:0;padding:0">${['tx','task','note'].map(k=>`<button type="button" class="chip ${k===kind?'on':''}" data-act="switch" data-kind="${k}">${{tx:'Χρήματα',task:'Task',note:'Σημείωση'}[k]}</button>`).join('')}</div>`:'';
 dlg.innerHTML=`<form id="frm" class="glass"><h2>${id?'Αλλαγή':'Νέα καταχώρηση:'} ${T[0]}</h2><p class="sub">${T[1]}</p>${pick}${body}${kind==='rec'&&id?'<p class="sub" style="margin:0">Για να σταματήσει, βάλε μήνα στο «Μέχρι»: οι προηγούμενοι μήνες μένουν. Η «Διαγραφή» σβήνει και όλους τους προηγούμενους μήνες.</p>':''}
 <div class="fb">${id?'<button type="button" class="btn red" data-act="del">Διαγραφή</button>':''}<button type="button" class="btn" data-act="close">Άκυρο</button><button class="cta">${id?'Αποθήκευση':'Δημιουργία'}</button></div></form>`;
 if(kind==='tx'||kind==='rec'){const q=n=>dlg.querySelector(n);
  dlg.querySelectorAll('[name=freq]').forEach(el=>el.addEventListener('change',()=>{const m=q('[name=freq]:checked').value==='monthly';q('#endw').style.display=m?'':'none';q('#dl').textContent=m?'Ξεκινά από':'Ημερομηνία';calc()}));q('[name=by]').value=v.by||'me';
  const calc=()=>{const a=parseFloat(String(q('[name=amount]').value).replace(',','.'))||0,sh=Math.min(100,Math.max(0,parseFloat(q('#fs').value)||0)),out=q('[name=type]:checked').value==='out',pr=proj(q('#fp').value),pn=pr?.partner||'οι συνεργάτες',m=a*sh/100;
   const tv=q('[name=type]:checked').value;q('#frm').dataset.t=tv;q('#thint').textContent=THINT[tv]||'';const mo=kind==='rec'||q('[name=freq]:checked')?.value==='monthly';q('#mine').innerHTML=a?`${mo?'<small style="color:#8fb5ff;font-weight:700">↻ Θα μπαίνει αυτόματα κάθε μήνα</small><br>':''}<small>${out?'Από το σύνολο σού αναλογεί να πληρώσεις':'Από το σύνολο σού αναλογούν'}${mo?' κάθε μήνα':''}</small><b>${eur(m)}</b><small>${sh<100?`${esc(pn)}: ${eur(a-m)} (${100-sh}%)`:'Όλο το ποσό είναι δικό σου'}</small>`:(mo?'<small style="color:#8fb5ff;font-weight:700">↻ Θα μπαίνει αυτόματα κάθε μήνα</small><br>':'')+'<small>Γράψε το συνολικό ποσό και θα δεις πόσο σου αναλογεί.</small>'};
  q('#fp').onchange=e=>{const pr=proj(e.target.value);q('#fpart').textContent=pr?.partner||'Συνεργάτης';const o=q('[name=dir]').options;o[0].textContent=(pr?.partner||'Ο συνεργάτης')+' μου έδωσε';o[1].textContent='Εγώ έδωσα σε '+(pr?.partner||'συνεργάτη');q('#fs').value=pShare(pr);calc()};
  dlg.querySelectorAll('[name=amount],#fs,[name=type]').forEach(el=>el.addEventListener('input',calc));calc()}
 dlg.querySelector('#frm').onsubmit=submit;if(!dlg.open)dlg.showModal();
}
function openShare(id){const p=proj(id);if(!p)return;F={kind:'share',id,col:'projects'};
 dlg.innerHTML=`<form id="frm" class="glass"><h2>Το ποσοστό μου στο ${esc(p.name)}</h2><p class="sub">Χρησιμοποιείται σε κάθε νέα κίνηση για να βγαίνει τι αναλογεί σε σένα.</p>
 <label>Το ποσοστό μου (%)<input name="share" id="ss" type="number" inputmode="decimal" min="0" max="100" step="0.5" required value="${esc(p.share??pShare(p))}"></label>
 <div class="mine" id="sm"></div><div class="fb"><button type="button" class="btn" data-act="close">Άκυρο</button><button class="cta">Αποθήκευση</button></div></form>`;
 const sm=()=>{const v=Math.min(100,Math.max(0,parseFloat(dlg.querySelector('#ss').value)||0));dlg.querySelector('#sm').innerHTML=`<small>Εσύ</small><b>${v}%</b><small>${esc(p.partner||'Οι συνεργάτες')}: ${100-v}%</small>`};
 dlg.querySelector('#ss').addEventListener('input',sm);sm();
 dlg.querySelector('#frm').onsubmit=async e=>{e.preventDefault();const v=Math.min(100,Math.max(0,parseFloat(dlg.querySelector('#ss').value)||0));dlg.close();
  try{await db.collection('projects').doc(id).update({share:v});toast(`${p.name}: το ποσοστό σου είναι ${v}%`)}catch{toast('Δεν αποθηκεύτηκε.')}};
 if(!dlg.open)dlg.showModal();dlg.querySelector('#ss').select()}
async function submit(e){
 e.preventDefault();const d=Object.fromEntries(new FormData(e.target));let {kind,col}=F;if(kind==='tx'&&d.freq==='monthly'){kind='rec';col='rec'}let id=F.id;const old=(id&&S[col].find(x=>x.id===id))||{};let body;
 if((kind==='tx'||kind==='rec')&&d.type==='settle')body={type:'settle',dir:d.dir,amount:Math.round(parseFloat(String(d.amount).replace(',','.'))*100)/100,...(kind==='rec'?{start:d.date,end:d.end||''}:{date:d.date}),project:d.project,desc:d.desc.trim()};
 else if(kind==='tx'||kind==='rec')body={type:d.type,amount:Math.round(parseFloat(String(d.amount).replace(',','.'))*100)/100,...(kind==='rec'?{start:d.date,end:d.end||''}:{date:d.date}),project:d.project,desc:d.desc.trim(),cat:d.cat.trim(),by:d.by,share:Math.min(100,Math.max(0,parseFloat(d.share)||0))};
 else if(kind==='task')body={title:d.title.trim(),project:d.project,due:d.due,prio:d.prio,done:!!old.done,doneAt:old.doneAt||0};
 else if(kind==='note')body={project:d.project,text:d.text.trim(),date:old.date||today()};
 else if(kind==='project'){body={name:d.name.trim(),status:d.status,partner:d.partner.trim(),next:d.next.trim(),desc:d.desc.trim()};if(d.share!=='')body.share=Math.min(100,Math.max(0,parseFloat(d.share)||0))}
 if(body&&(body.type==='invest'||body.type==='return')){body.by='me';delete body.share}
 if((kind==='tx'||kind==='rec')&&!(body.amount>0))return toast('Βάλε ποσό μεγαλύτερο από 0');
 if(kind!=='project'&&!body.project)return toast('Φτιάξε πρώτα ένα project');
 if(!id)id=kind==='project'?'p'+Date.now().toString(36):db.collection(col).doc().id;
 body.created=old.created||Date.now();dlg.close();
 if(await save(col,id,body)){toast(F.id?'Αποθηκεύτηκε':kind==='rec'?'Θα μπαίνει αυτόματα κάθε μήνα':'Προστέθηκε');if(kind==='project'&&!F.id)location.hash='p-'+id}
}
async function save(col,id,body){try{await db.collection(col).doc(id).set(body);return true}catch(e){toast(e&&e.code==='quota_exceeded'?'Ο χώρος γέμισε.':'Δεν αποθηκεύτηκε. Δοκίμασε ξανά.');return false}}
let tT;function toast(t,undo){const el=$('toast');el.querySelector('span').textContent=t;const b=el.querySelector('button');b.style.display=undo?'':'none';b.onclick=()=>{undo();el.style.display='none'};el.style.display='flex';clearTimeout(tT);tT=setTimeout(()=>el.style.display='none',5000)}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='add'){if(!db)return toast('Η αποθήκευση δεν είναι διαθέσιμη.');openForm(!S.projects.length?'project':(b.dataset.kind||'tx'),null,b.dataset.type)}
 else if(a==='share'){e.preventDefault();e.stopPropagation();if(db)openShare(id)}
 else if(a==='switch')openForm(b.dataset.kind);else if(a==='edit'){e.preventDefault();openForm(b.dataset.kind,id)}else if(a==='close')dlg.close();
 else if(a==='toggle'){const t=S.tasks.find(x=>x.id===id);if(t)try{await db.collection('tasks').doc(id).update({done:!t.done,doneAt:t.done?0:Date.now()})}catch{toast('Δεν αποθηκεύτηκε.')}}
 else if(a==='pdel'){e.preventDefault();e.stopPropagation();askDelProject(id)}
 else if(a==='pdelok'){dlg.close();delProject(id)}
 else if(a==='del'&&F.col==='projects'){askDelProject(F.id)}
 else if(a==='del'){const {col,id:did}=F,old=S[col].find(x=>x.id===did);if(!old)return;const {id:_,...keep}=old;dlg.close();
  try{await db.collection(col).doc(did).delete();if(col==='projects')location.hash='projects';toast('Διαγράφηκε',()=>save(col,did,keep))}catch{toast('Δεν διαγράφηκε.')}}
 else if(a==='tf'){S.tf=id;render()}else if(a==='mf'){S.mf=id;render()}else if(a==='month'){S.month=mShift(S.month,+b.dataset.d);render()}
 else if(a==='bg')$('bgfile').click();
 else if(a==='settings')APP.settings(dlg,toast);
});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-pid]');if(c){e.dataTransfer.setData('text/plain',c.dataset.pid);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',async e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('over');const pid=e.dataTransfer.getData('text/plain'),p=proj(pid);
 if(p&&p.status!==c.dataset.drop)try{await db.collection('projects').doc(pid).update({status:c.dataset.drop});toast(`${p.name}: ${STATUS[c.dataset.drop]}`)}catch{toast('Δεν αποθηκεύτηκε.')}});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();render()});
window.addEventListener('hashchange',()=>{if(S.q){S.q='';$('q').value=''}render();scrollTo(0,0)});
function applyBg(){let u=null;try{u=localStorage.getItem('bg')}catch{}const s=$('scene');s.classList.toggle('photo',!!u);s.style.backgroundImage=u?`url("${u}")`:''}
$('bgfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 let prev=null;try{prev=localStorage.getItem('bg')}catch{}try{localStorage.setItem('bg',c.toDataURL('image/jpeg',.8));applyBg();toast('Το φόντο άλλαξε σε αυτή τη συσκευή',()=>{try{prev?localStorage.setItem('bg',prev):localStorage.removeItem('bg')}catch{}applyBg()})}catch{toast('Η εικόνα δεν αποθηκεύτηκε σε αυτή τη συσκευή')}URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);e.target.value=''});
applyBg();

if(CFG.env==='dev')$('envtag').innerHTML='<span class="envtag">DEV</span>';
APP.start(d=>{db=d;
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>({id:x.id,...x.data()}));recon();S.ready=true;if(!dlg.open)render()}));
 dlg.addEventListener('close',render);render();
},e=>{msg.textContent='Πρόβλημα φόρτωσης δεδομένων: '+(e.message||e);S.ready=true;render()});
render();
}
</script>
</body></html>
