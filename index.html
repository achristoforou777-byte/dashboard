<style>
/* VOICE: a private command centre: quiet, premium, nocturnal.
   IDEA: frosted-glass instruments floating over a warm, blurred room at night.
   PICTURE: glass cards (KPIs with sparklines, cash-flow chart, project pipeline) over a glowing ambient scene or the owner's own photo.
   COLOUR and TYPE: near-black warm ground, ember orange accent, mint for money in; Plus Jakarta Sans.
   LAYOUT: glass sidebar + top bar on Mac; glass tab bar + orange add button on the phone; one dark palette in both themes. */
:root{color-scheme:dark;--ink:#f6f1ec;--mute:rgba(246,241,236,.72);--dim:rgba(246,241,236,.52);--line:rgba(255,255,255,.09);--edge:rgba(255,255,255,.15);--hi:rgba(255,255,255,.24);--acc:#ff6a3d;--acc2:#ff9b54;--good:#62e3ae;--bad:#ff8170;--r:22px}
*{box-sizing:border-box;min-width:0}
html{background:#0d0b0a}
body{margin:0;color:var(--ink);font:15px/1.5 "Plus Jakarta Sans",system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased;min-height:100vh}
a{color:inherit;text-decoration:none}button,input,select,textarea{font:inherit;color:inherit}
.scene{position:fixed;inset:0;z-index:-1;overflow:hidden;background:#0d0b0a center/cover no-repeat}
.scene i{position:absolute;border-radius:50%;filter:blur(70px);opacity:.75}
.scene i:nth-child(1){width:46vmax;height:46vmax;left:-12vmax;top:-14vmax;background:radial-gradient(#ff6a3d,transparent 65%)}
.scene i:nth-child(2){width:40vmax;height:40vmax;right:-10vmax;top:5vmax;background:radial-gradient(#b8763a,transparent 65%);opacity:.55}
.scene i:nth-child(3){width:50vmax;height:50vmax;right:5vmax;bottom:-28vmax;background:radial-gradient(#245a5e,transparent 65%);opacity:.6}
.scene i:nth-child(4){width:34vmax;height:34vmax;left:18vmax;bottom:-12vmax;background:radial-gradient(#5b2440,transparent 65%);opacity:.55}
.scene.photo i{display:none}.scene.photo::after{content:"";position:absolute;inset:0;background:rgba(10,8,7,.35)}
@media(prefers-reduced-motion:no-preference){.scene i{animation:drift 26s ease-in-out infinite alternate}.scene i:nth-child(2){animation-duration:32s}.scene i:nth-child(3){animation-duration:38s}
 @keyframes drift{to{transform:translate(6vmax,4vmax) scale(1.08)}}}
.glass{position:relative;background:linear-gradient(155deg,rgba(255,255,255,.15),rgba(255,255,255,.075) 45%,rgba(255,255,255,.10));backdrop-filter:blur(72px) saturate(170%);-webkit-backdrop-filter:blur(72px) saturate(170%);border:1px solid var(--edge);border-radius:var(--r);box-shadow:inset 0 1px 0 var(--hi),0 24px 60px -24px rgba(0,0,0,.7)}
.shell{display:grid;grid-template-columns:250px minmax(0,1fr);gap:18px;padding:18px;max-width:1500px;margin:0 auto}
aside{position:sticky;top:18px;height:calc(100vh - 36px);display:flex;flex-direction:column;padding:18px 12px}
.brand{display:flex;align-items:center;gap:10px;padding:2px 8px 18px;font-weight:800;font-size:17px}
.logo{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;background:linear-gradient(135deg,var(--acc),var(--acc2));color:#1a0d07;font-weight:800;font-size:14px;box-shadow:0 6px 18px -4px var(--acc)}
.sec{font-size:11.5px;color:var(--dim);padding:14px 10px 6px;font-weight:600}
.nav a,.plink{display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:12px;color:var(--mute);font-weight:500;min-height:42px}
.nav a:hover,.plink:hover{color:var(--ink);background:rgba(255,255,255,.05)}
.nav a.on{color:var(--ink);background:rgba(255,255,255,.1);box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.nav svg{width:18px;height:18px;flex:none}
.badge{margin-left:auto;min-width:20px;height:20px;padding:0 6px;border-radius:999px;background:var(--acc);color:#1a0d07;font-size:11.5px;font-weight:700;display:grid;place-items:center}
.dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 10px currentColor}
.plist{overflow:auto;flex:1}
.meter{margin:10px 6px 4px;padding:12px;border-radius:16px;background:rgba(0,0,0,.18);border:1px solid var(--line)}

.track{height:6px;border-radius:9px;background:rgba(255,255,255,.08);margin-top:8px;overflow:hidden}.track span{display:block;height:100%;border-radius:9px;background:linear-gradient(90deg,var(--acc),var(--acc2))}

.top{display:flex;align-items:center;gap:12px;padding:12px 14px 12px 22px;margin-bottom:18px}

.search{margin-left:auto;display:flex;align-items:center;gap:8px;background:rgba(0,0,0,.22);border:1px solid var(--line);border-radius:999px;padding:0 14px;height:42px;width:min(320px,34vw)}

.kpi strong{display:block;font-size:clamp(22px,2.4vw,30px);font-weight:800;letter-spacing:-.02em;margin:10px 0 2px;white-space:nowrap;font-variant-numeric:tabular-nums}
.spark{display:block;width:100%;height:34px}

.card{padding:20px}

.chead{flex-wrap:wrap;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:12px}
.legend{display:flex;gap:14px;font-size:12.5px;color:var(--mute)}.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:3px;background:var(--c)}
.big{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:6px 0 0;font-variant-numeric:tabular-nums}
.fig{position:relative;height:230px;margin-top:8px}.fig svg{position:absolute;inset:0;width:100%;height:100%}

.chk{flex:none;width:24px;height:24px;border-radius:8px;border:1.5px solid rgba(255,255,255,.35);background:rgba(255,255,255,.04);cursor:pointer;display:grid;place-items:center;transition:.2s}
.chk:hover{border-color:var(--acc)}.done .chk{background:linear-gradient(135deg,var(--acc2),var(--acc));border-color:transparent}
.done .chk::after{content:"";width:9px;height:5px;border:2px solid #1d0c05;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tt{flex:1;text-align:left;background:none;border:0;padding:9px 0;cursor:pointer}
.tt small{display:flex;align-items:center;gap:6px;color:var(--dim);font-size:12.5px}.done .tt>span{text-decoration:line-through;color:var(--dim)}

.grp{font-size:12px;color:var(--dim);font-weight:600;margin:14px 0 2px}.grp:first-child{margin-top:0}
.pcard{display:block;padding:14px;border-radius:16px;background:rgba(255,255,255,.045);border:1px solid var(--line);margin-bottom:10px;transition:.2s;cursor:pointer}

.pcard .t{display:flex;align-items:center;gap:9px;font-weight:700}.xbtn{margin-left:auto;flex:none;width:34px;height:34px;border-radius:10px;border:1px solid transparent;background:none;color:var(--dim);cursor:pointer;display:grid;place-items:center}.xbtn:hover{color:var(--bad);border-color:rgba(255,129,112,.4);background:rgba(255,129,112,.1)}.xbtn svg{width:17px}.pcard p{margin:6px 0 10px;color:var(--mute);font-size:13px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pmeta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 14px;font-size:12.5px;color:var(--mute)}

.sharebtn{border:1px solid rgba(255,155,84,.45);background:rgba(255,106,61,.12);color:var(--acc2);border-radius:999px;padding:0 11px;height:30px;font-size:12.5px;font-weight:700;cursor:pointer;white-space:nowrap}.sharebtn.unset{border-style:dashed}.sharebtn:hover{background:rgba(255,106,61,.22)}
.mine{padding:12px 14px;border-radius:14px;background:rgba(255,106,61,.1);border:1px solid rgba(255,106,61,.3);font-size:14px;line-height:1.45}.mine b{font-size:20px;display:block;color:var(--ink)}.mine small{color:var(--mute)}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}.pos{color:var(--good)}.neg{color:var(--bad)}
.board{display:grid;grid-template-columns:repeat(3,minmax(260px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}

.row{display:grid;grid-template-columns:44px minmax(0,1fr) auto;gap:12px;align-items:center;width:100%;background:none;border:0;border-bottom:1px solid var(--line);padding:11px 0;text-align:left;cursor:pointer}
.row:last-child{border-bottom:0}.ico{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.06);border:1px solid var(--line)}

.btn{white-space:nowrap;flex:none;display:inline-flex;align-items:center;gap:6px;border:1px solid var(--edge);background:rgba(255,255,255,.06);border-radius:999px;padding:0 16px;height:40px;cursor:pointer;font-weight:600;font-size:13.5px}

.settle{padding:14px 16px;border-radius:16px;background:rgba(255,106,61,.1);border:1px solid rgba(255,106,61,.3);margin-bottom:12px}.settle small{color:var(--mute)}

.icb{width:40px;height:40px;border-radius:50%;border:1px solid var(--edge);background:rgba(255,255,255,.06);cursor:pointer;display:grid;place-items:center}

dialog{border:0;padding:0;background:none;color:var(--ink);width:min(540px,94vw);max-height:92vh;overflow:visible}

{

function calItems(m){const out=[];
 S.tasks.filter(x=>(x.due||'').startsWith(m)).forEach(x=>out.push({k:'task',d:x.due,x}));
 S.tx.filter(x=>(x.date||'').startsWith(m)).forEach(x=>out.push({k:'tx',d:x.date,x}));
 S.rec.forEach(r=>{if(!r.start||r.start.slice(0,7)>m||(r.end&&r.end<m))return;const day=+r.start.slice(8,10)||1,dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),d=m+'-'+String(Math.min(day,dim)).padStart(2,'0');
  if(d>=r.start)out.push({k:'tx',d,x:{...r,id:'r~'+r.id+'~'+m,rid:r.id,date:d}})});
 return out}
function calRange(a,b){const out=[];let m=a.slice(0,7);while(m<=b.slice(0,7)){out.push(...calItems(m));m=mShift(m,1)}return out.filter(i=>i.d>=a&&i.d<=b)}
const isOutX=x=>x.type==='out'||x.type==='invest'||(x.type==='settle'&&x.dir==='out');
const sortItems=l=>l.sort((a,b)=>(a.k==='task'?0:1)-(b.k==='task'?0:1)||(a.x.time||'99').localeCompare(b.x.time||'99'));
const weekStart=d=>{const x=new Date(d+'T12:00');x.setDate(x.getDate()-(x.getDay()+6)%7);return iso(x)};
const dLabel=(d,o={weekday:'long',day:'numeric',month:'long'})=>new Date(d+'T12:00').toLocaleDateString('el-GR',o);
function dayList(d,l){l=sortItems(l);return l.length?l.map(i=>i.k==='task'?taskRow(i.x):txRow(i.x)).join(''):empty('Τίποτα για αυτή τη μέρα.')}
function vCal(){
 const v=S.cv||'week',t=today(),d=S.cd||t;
 let title,body;
 if(v==='day'){title=dLabel(d);body=`<section class="card glass"><div class="chead"><div><h2>${dLabel(d,{weekday:'long'})}</h2><p class="sub">${dLabel(d,{day:'numeric',month:'long',year:'numeric'})}</p></div><div style="display:flex;gap:8px"><button class="btn" data-act="add" data-kind="task" data-date="${d}">+ Task</button><button class="btn" data-act="add" data-kind="tx" data-type="out" data-date="${d}">+ Πληρωμή</button></div></div>${dayList(d,calRange(d,d))}</section>`}
 else if(v==='week'){const a=weekStart(d),b=addDays(a,6),items=calRange(a,b),by={};items.forEach(i=>(by[i.d]??=[]).push(i));
  title=`${dLabel(a,{day:'numeric',month:'short'})} – ${dLabel(b,{day:'numeric',month:'short',year:'numeric'})}`;
  body=`<section class="week">${Array.from({length:7},(_,k)=>{const dd=addDays(a,k),l=by[dd]||[];return `<div class="wday glass ${dd===t?'td':''}"><button class="wdh" data-act="cday" data-d="${dd}"><b>${dLabel(dd,{weekday:'short'})}</b><span>${dLabel(dd,{day:'numeric',month:'short'})}</span></button>
   <div class="wdl">${l.length?sortItems(l).map(i=>i.k==='task'?taskRow(i.x):txRow(i.x)).join(''):'<p class="empty" style="padding:6px 0">—</p>'}</div><button class="wadd" data-act="add" data-kind="task" data-date="${dd}">+ Task</button></div>`}).join('')}</section>`}
 else{const m=d.slice(0,7),items=calItems(m),by={};items.forEach(i=>(by[i.d]??=[]).push(i));title=mName(m);
  const first=new Date(m+'-01T12:00'),off=(first.getDay()+6)%7,dim=new Date(+m.slice(0,4),+m.slice(5,7),0).getDate(),cells=[];for(let i=0;i<off;i++)cells.push('<div class="cc out"></div>');
  for(let dd=1;dd<=dim;dd++){const ds=m+'-'+String(dd).padStart(2,'0'),l=sortItems(by[ds]||[]);
   const chip=i=>{if(i.k==='task'){const late=!i.x.done&&ds<t;return `<span class="ch ${i.x.done?'dz':''} ${late?'lt':''}">${i.x.time?`<b>${esc(i.x.time)}</b> `:''}${esc(i.x.title)}</span>`}
    const o=isOutX(i.x),st=i.x.type==='settle';return `<span class="ch ${st?'st':o?'mo':'mi'}">${o?'−':'+'}${eur(+i.x.amount)} ${esc(i.x.desc||'')}</span>`};
   const dots=[...new Set(l.map(i=>i.k==='task'?'t':i.x.type==='settle'?'s':isOutX(i.x)?'o':'i'))].map(c=>`<i class="cd-${c}"></i>`).join('');
   cells.push(`<button class="cc ${ds===t?'td':''} ${ds===d?'sel':''} ${ds<t?'past':''}" data-act="cd" data-d="${ds}"><span class="dn">${dd}</span><span class="chs">${l.slice(0,3).map(chip).join('')}${l.length>3?`<span class="more">+${l.length-3}</span>`:''}</span><span class="dots">${dots}</span></button>`)}
  while(cells.length%7)cells.push('<div class="cc out"></div>');
  const dl=calRange(d,d);
  body=`<section class="calw"><div class="card glass calc"><div class="cgrid head">${['Δευ','Τρι','Τετ','Πεμ','Παρ','Σαβ','Κυρ'].map(x=>`<span>${x}</span>`).join('')}</div><div class="cgrid">${cells.join('')}</div>
  <div class="clegend"><span><i class="cd-t"></i>Task</span><span><i class="cd-o"></i>Πληρωμή</span><span><i class="cd-i"></i>Έσοδο</span><span><i class="cd-s"></i>Εξόφληση</span></div></div>
  <div class="card glass" id="dayp"><div class="chead"><div><h2>${dLabel(d)}</h2><p class="sub">${dl.length?`${dl.length} ${dl.length===1?'καταχώρηση':'καταχωρήσεις'}`:'Τίποτα για αυτή τη μέρα'}</p></div></div>
  ${dl.length?dayList(d,dl):''}<div class="fb" style="justify-content:flex-start;margin-top:12px"><button class="btn" data-act="add" data-kind="task" data-date="${d}">+ Task</button><button class="btn" data-act="add" data-kind="tx" data-type="out" data-date="${d}">+ Πληρωμή</button></div></div></section>`}
 return `<div class="acts" style="justify-content:space-between;align-items:center;flex-wrap:wrap"><div class="month"><button class="icb" data-act="cnav" data-d="-1" aria-label="Πίσω">‹</button><b>${title}</b><button class="icb" data-act="cnav" data-d="1" aria-label="Μπροστά">›</button>${d!==t?'<button class="btn" data-act="cnav" data-d="0" style="margin-left:6px">Σήμερα</button>':''}</div>
 <div class="seg vseg">${[['day','Ημέρα'],['week','Εβδομάδα'],['month','Μήνας']].map(([k,l])=>`<label><input type="radio" name="cv" value="${k}" data-act="cview" ${v===k?'checked':''}><span data-act="cview" data-v="${k}">${l}</span></label>`).join('')}</div></div>${body}`}

 $('meter').innerHTML=`<small><span>Το μερίδιό μου</span></small><b class="${sgn(mn)}">${signed(mn)}</b><small style="margin-top:6px"><span>Συνεργάτες</span><span class="${owe(ow)}">${signed(ow)}</span></small>`;
 const p=r.startsWith('p-')&&proj(r.slice(2));
 $('ttl').textContent=S.q?'Αναζήτηση':p?'Project':({home:'Αρχική',projects:'Projects',tasks:'Tasks',money:'Χρήματα',cal:'Ημερολόγιο'}[r]||'Αρχική');
 $('tsub').textContent=new Date().toLocaleDateString('el-GR',{weekday:'long',day:'numeric',month:'long'});
}
function render(){
 chrome();if(!S.ready)return;const r=route();
 app.innerHTML=S.q?vSearch(S.q):r.startsWith('p-')?vProject(r.slice(2)):r==='projects'?vProjects():r==='tasks'?vTasks():r==='money'?vMoney():r==='cal'?vCal():vHome();
}
const curP=()=>{const r=route();return r.startsWith('p-')?r.slice(2):(r==='tasks'&&S.tf!=='all'?S.tf:r==='money'&&S.mf!=='all'?S.mf:'')};
const projOpts=sel=>projs().map(p=>`<option value="${esc(p.id)}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('');

function projDocs(pid){return [['tasks',S.tasks],['tx',S.tx],['notes',S.notes],['rec',S.rec]].flatMap(([c,l])=>l.filter(x=>x.project===pid).map(x=>[c,x]))}
function askDelProject(pid){const p=proj(pid);if(!p)return;const d=projDocs(pid),n=c=>d.filter(x=>x[0]===c).length;
 const parts=[n('tasks')&&`${n('tasks')} ${n('tasks')===1?'task':'tasks'}`,(n('tx')+n('rec'))&&`${n('tx')+n('rec')} ${n('tx')+n('rec')===1?'κίνηση':'κινήσεις'}`,n('notes')&&`${n('notes')} ${n('notes')===1?'σημείωση':'σημειώσεις'}`].filter(Boolean);
 dlg.innerHTML=`<form class="glass" onsubmit="return false"><h2>Διαγραφή «${esc(p.name)}»;</h2><p class="sub">${parts.length?`Θα σβηστούν μαζί και ${parts.join(', ')} του project.`:'Το project δεν έχει tasks, κινήσεις ή σημειώσεις.'} Αν το μετανιώσεις, θα έχεις λίγα δευτερόλεπτα για «Αναίρεση».</p>
 <div class="fb"><button type="button" class="btn" data-act="close">Άκυρο</button><button type="button" class="btn red" style="background:rgba(255,129,112,.15)" data-act="pdelok" data-id="${esc(pid)}">Διαγραφή</button></div></form>`;
 if(!dlg.open)dlg.showModal()}
async function delProject(pid){const p=proj(pid);if(!p)return;const all=[['projects',p],...projDocs(pid)].map(([c,x])=>{const {id,...keep}=x;return [c,id,keep]});
 try{for(const [c,id] of all)await db.collection(c).doc(id).delete();if(route()==='p-'+pid)location.hash='projects';
  toast(`Το «${p.name}» διαγράφηκε`,async()=>{for(const [c,id,keep] of all)await save(c,id,keep);toast('Επαναφέρθηκε')})}catch{toast('Δεν διαγράφηκε όλο. Δοκίμασε ξανά.')}}
function openForm(kind,id,type){
 const col={tx:'tx',rec:'rec',task:'tasks',note:'notes',project:'projects'}[kind],v=(id&&S[col].find(x=>x.id===id))||{},pid=v.project||curP()||projs()[0]?.id||'';
 F={kind,id,col};let body='';
 if(kind==='tx'||kind==='rec'){const ty=v.type==='invest'?'out':v.type==='return'?'in':(v.type||type||'out'),pr=proj(pid),mo=kind==='rec';
  body=`${id?'':`<div class="seg"><label><input type="radio" name="freq" value="once" ${mo?'':'checked'}><span>Μία φορά</span></label><label><input type="radio" name="freq" value="monthly" ${mo?'checked':''}><span>Κάθε μήνα</span></label></div>`}<div class="seg">${TYPES.map(([k,l])=>`<label><input type="radio" name="type" value="${k}" ${ty===k?'checked':''}><span>${l}</span></label>`).join('')}</div><p class="sub" id="thint" style="margin:-4px 0 0"></p>
  <label class="os">Ποιος έδωσε σε ποιον<select name="dir"><option value="in" ${v.dir!=='out'?'selected':''}>${esc(pr?.partner||'Ο συνεργάτης')} μου έδωσε</option><option value="out" ${v.dir==='out'?'selected':''}>Εγώ έδωσα σε ${esc(pr?.partner||'συνεργάτη')}</option></select></label>
  <div class="two"><label>Ποσό (€)<input name="amount" type="number" inputmode="decimal" step="0.01" min="0" required value="${esc(v.amount??'')}" placeholder="0,00"></label><label><span id="dl">${mo?'Ξεκινά από':'Ημερομηνία'}</span><input name="date" type="date" required value="${esc((mo?v.start:v.date)||S.pre||today())}"></label></div>
  <label id="endw" style="${mo?'':'display:none'}">Μέχρι (μήνας, προαιρετικό: άφησέ το κενό αν συνεχίζεται)<input name="end" type="month" value="${esc(v.end||'')}"></label>
  <label class="ns2"><span id="byl">Ποιος πλήρωσε</span><select name="by" id="fby"></select></label>
  <div class="two"><label>Project<select name="project" id="fp">${projOpts(pid)}</select></label><label class="ns">Το ποσοστό μου (%)<input name="share" id="fs" type="number" inputmode="decimal" min="0" max="100" step="0.5" required value="${esc(v.share??pShare(pr))}"></label></div>
  <div class="mine ns" id="mine"></div>
  <label>Περιγραφή<input name="desc" value="${esc(v.desc||'')}" placeholder="π.χ. κάρβουνα για την Ορά"></label>
  <div class="two ns"><label>Κατηγορία<input name="cat" list="cats" value="${esc(v.cat||'')}" placeholder="Υλικά, Μεταφορικά…"></label><span></span></div>
  <datalist id="cats">${[...new Set(['Υλικά','Μεταφορικά','Marketing','Άδειες','Εξοπλισμός','Καύσιμα','Πωλήσεις','Προμήθεια',...S.tx.map(x=>x.cat).filter(Boolean)])].map(c=>`<option value="${esc(c)}">`).join('')}</datalist>`}
 else if(kind==='task')body=`<label>Τι πρέπει να γίνει<input name="title" required value="${esc(v.title||'')}" placeholder="π.χ. Τηλέφωνο στη bonÀrea"></label><label>Project<select name="project">${projOpts(pid)}</select></label>
  <div class="two"><label>Ημερομηνία<input name="due" type="date" value="${esc(v.due||(id?'':S.pre||today()))}"></label><label>Ώρα (προαιρετικά)<input name="time" type="time" value="${esc(v.time||'')}"></label></div><div class="two"><label>Προτεραιότητα<select name="prio"><option value="normal">Κανονική</option><option value="high" ${v.prio==='high'?'selected':''}>Υψηλή</option></select></label></div>`;
 else if(kind==='note')body=`<label>Project<select name="project">${projOpts(pid)}</select></label><label>Σημείωση<textarea name="text" rows="5" required placeholder="Τι έγινε, τι συμφωνήθηκε…">${esc(v.text||'')}</textarea></label>`;
 else body=`<label>Όνομα<input name="name" required value="${esc(v.name||'')}"></label>
  <label>Στάδιο</label><div class="seg" style="margin-top:-8px">${['active','archive'].map(k=>`<label><input type="radio" name="status" value="${k}" ${((v.status||'active')==='active'?'active':'archive')===k?'checked':''}><span>${STATUS[k]}</span></label>`).join('')}</div>
  <div class="two"><label>Συνεργάτης<input name="partner" value="${esc(v.partner||'')}"></label><label>Το ποσοστό μου (%)<input name="share" type="number" inputmode="decimal" min="0" max="100" step="0.5" value="${esc(v.share??'')}" placeholder="π.χ. 50"></label></div><div class="two"><label>Επόμενο βήμα<input name="next" value="${esc(v.next||'')}"></label></div><label>Περιγραφή<textarea name="desc" rows="3">${esc(v.desc||'')}</textarea></label>`;
 const T={rec:['μηνιαία κίνηση','Επαναλαμβάνεται αυτόματα κάθε μήνα'],tx:['κίνηση','Τι πλήρωσες ή τι πήρες σε ένα project'],task:['task','Κάτι που πρέπει να γίνει'],note:['σημείωση','Ενημέρωση για την πορεία ενός project'],project:['project','Μια εταιρεία ή ένα venture σου']}[kind];
 const pick=!id&&kind!=='project'?`<div class="chips" style="margin:0;padding:0">${['tx','task','note'].map(k=>`<button type="button" class="chip ${k===kind?'on':''}" data-act="switch" data-kind="${k}">${{tx:'Χρήματα',task:'Task',note:'Σημείωση'}[k]}</button>`).join('')}</div>`:'';
 dlg.innerHTML=`<form id="frm" class="glass"><h2>${id?'Αλλαγή':'Νέα καταχώρηση:'} ${T[0]}</h2><p class="sub">${T[1]}</p>${pick}${body}${kind==='rec'&&id?'<p class="sub" style="margin:0">Για να σταματήσει, βάλε μήνα στο «Μέχρι»: οι προηγούμενοι μήνες μένουν. Η «Διαγραφή» σβήνει και όλους τους προηγούμενους μήνες.</p>':''}
 <div class="fb">${id?'<button type="button" class="btn red" data-act="del">Διαγραφή</button>':''}<button type="button" class="btn" data-act="close">Άκυρο</button><button class="cta">${id?'Αποθήκευση':'Δημιουργία'}</button></div></form>`;
 if(kind==='tx'||kind==='rec'){const q=n=>dlg.querySelector(n);
  dlg.querySelectorAll('[name=freq]').forEach(el=>el.addEventListener('change',()=>{const m=q('[name=freq]:checked').value==='monthly';q('#endw').style.display=m?'':'none';q('#dl').textContent=m?'Ξεκινά από':'Ημερομηνία';calc()}));
  let curBy=v.type==='return'?'share':(v.by||'me');const fillBy=()=>{const tv=q('[name=type]:checked').value,pn=esc(proj(q('#fp').value)?.partner||'Συνεργάτης'),sel=q('#fby'),keep=sel.value||curBy;
   const opts=tv==='in'?[['company','Η εταιρεία (μπήκαν στο project)'],['me','Εγώ (τα κράτησα εγώ)'],['partner',pn+' (τα κράτησε)'],['share','Εμένα, το μερίδιό μου']]:[['me','Εγώ'],['partner',pn],['company','Η εταιρεία']];
   sel.innerHTML=opts.map(([k,l])=>`<option value="${k}">${l}</option>`).join('');sel.value=opts.some(o=>o[0]===keep)?keep:opts[0][0];q('#byl').textContent=tv==='in'?'Ποιος τα πήρε':'Ποιος πλήρωσε'};fillBy();
  q('#fby').onchange=()=>{curBy=q('#fby').value;calc()};dlg.querySelectorAll('[name=type]').forEach(el=>el.addEventListener('change',()=>{q('#fby').innerHTML='';curBy='';fillBy();calc()}));
  const calc=()=>{const a=parseFloat(String(q('[name=amount]').value).replace(',','.'))||0,sh=Math.min(100,Math.max(0,parseFloat(q('#fs').value)||0)),out=q('[name=type]:checked').value==='out',pr=proj(q('#fp').value),pn=pr?.partner||'οι συνεργάτες',m=a*sh/100;
   const tv=q('[name=type]:checked').value;q('#frm').dataset.t=tv==='in'&&q('#fby').value==='share'?'return':tv;q('#thint').textContent=THINT[tv]||'';const mo=kind==='rec'||q('[name=freq]:checked')?.value==='monthly';q('#mine').innerHTML=a?`${mo?'<small style="color:#8fb5ff;font-weight:700">↻ Θα μπαίνει αυτόματα κάθε μήνα</small><br>':''}<small>${out?'Από το σύνολο σού αναλογεί να πληρώσεις':'Από το σύνολο σού αναλογούν'}${mo?' κάθε μήνα':''}</small><b>${eur(m)}</b><small>${sh<100?`${esc(pn)}: ${eur(a-m)} (${100-sh}%)`:'Όλο το ποσό είναι δικό σου'}</small>`:(mo?'<small style="color:#8fb5ff;font-weight:700">↻ Θα μπαίνει αυτόματα κάθε μήνα</small><br>':'')+'<small>Γράψε το συνολικό ποσό και θα δεις πόσο σου αναλογεί.</small>'};
  q('#fp').onchange=e=>{const pr=proj(e.target.value);fillBy();const o=q('[name=dir]').options;o[0].textContent=(pr?.partner||'Ο συνεργάτης')+' μου έδωσε';o[1].textContent='Εγώ έδωσα σε '+(pr?.partner||'συνεργάτη');q('#fs').value=pShare(pr);calc()};
  dlg.querySelectorAll('[name=amount],#fs,[name=type]').forEach(el=>el.addEventListener('input',calc));calc()}
 dlg.querySelector('#frm').onsubmit=submit;if(!dlg.open)dlg.showModal();
}
function openShare(id){const p=proj(id);if(!p)return;F={kind:'share',id,col:'projects'};
 dlg.innerHTML=`<form id="frm" class="glass"><h2>Το ποσοστό μου στο ${esc(p.name)}</h2><p class="sub">Χρησιμοποιείται σε κάθε νέα κίνηση για να βγαίνει τι αναλογεί σε σένα.</p>
 <label>Το ποσοστό μου (%)<input name="share" id="ss" type="number" inputmode="decimal" min="0" max="100" step="0.5" required value="${esc(p.share??pShare(p))}"></label>
 <div class="mine" id="sm"></div><div class="fb"><button type="button" class="btn" data-act="close">Άκυρο</button><button class="cta">Αποθήκευση</button></div></form>`;
 const sm=()=>{const v=Math.min(100,Math.max(0,parseFloat(dlg.querySelector('#ss').value)||0));dlg.querySelector('#sm').innerHTML=`<small>Εσύ</small><b>${v}%</b><small>${esc(p.partner||'Οι συνεργάτες')}: ${100-v}%</small>`};
 dlg.querySelector('#ss').addEventListener('input',sm);sm();
 dlg.querySelector('#frm').onsubmit=async e=>{e.preventDefault();const v=Math.min(100,Math.max(0,parseFloat(dlg.querySelector('#ss').value)||0));dlg.close();
  try{await db.collection('projects').doc(id).update({share:v});toast(`${p.name}: το ποσοστό σου είναι ${v}%`)}catch{toast('Δεν αποθηκεύτηκε.')}};
 if(!dlg.open)dlg.showModal();dlg.querySelector('#ss').select()}
async function submit(e){
 e.preventDefault();const d=Object.fromEntries(new FormData(e.target));let {kind,col}=F;if(kind==='tx'&&d.freq==='monthly'){kind='rec';col='rec'}let id=F.id;const old=(id&&S[col].find(x=>x.id===id))||{};let body;
 if((kind==='tx'||kind==='rec')&&d.type==='settle')body={type:'settle',dir:d.dir,amount:Math.round(parseFloat(String(d.amount).replace(',','.'))*100)/100,...(kind==='rec'?{start:d.date,end:d.end||''}:{date:d.date}),project:d.project,desc:d.desc.trim()};
 else if(kind==='tx'||kind==='rec')body={type:d.type,amount:Math.round(parseFloat(String(d.amount).replace(',','.'))*100)/100,...(kind==='rec'?{start:d.date,end:d.end||''}:{date:d.date}),project:d.project,desc:d.desc.trim(),cat:d.cat.trim(),by:d.by,share:Math.min(100,Math.max(0,parseFloat(d.share)||0))};
 else if(kind==='task')body={title:d.title.trim(),project:d.project,due:d.due,time:d.due?(d.time||''):'',prio:d.prio,done:!!old.done,doneAt:old.doneAt||0};
 else if(kind==='note')body={project:d.project,text:d.text.trim(),date:old.date||today()};
 else if(kind==='project'){body={name:d.name.trim(),status:d.status,partner:d.partner.trim(),next:d.next.trim(),desc:d.desc.trim()};if(d.share!=='')body.share=Math.min(100,Math.max(0,parseFloat(d.share)||0))}
 if(body&&body.type==='in'&&d.by==='share'){body.type='return';body.by='me';delete body.share}
 if(body&&(body.type==='invest'||body.type==='return')){body.by='me';delete body.share}
 if((kind==='tx'||kind==='rec')&&!(body.amount>0))return toast('Βάλε ποσό μεγαλύτερο από 0');
 if(kind!=='project'&&!body.project)return toast('Φτιάξε πρώτα ένα project');
 if(!id)id=kind==='project'?'p'+Date.now().toString(36):db.collection(col).doc().id;
 body.created=old.created||Date.now();dlg.close();
 if(await save(col,id,body)){toast(F.id?'Αποθηκεύτηκε':kind==='rec'?'Θα μπαίνει αυτόματα κάθε μήνα':'Προστέθηκε');if(kind==='project'&&!F.id)location.hash='p-'+id}
}
async function save(col,id,body){try{await db.collection(col).doc(id).set(body);return true}catch(e){toast(e&&e.code==='quota_exceeded'?'Ο χώρος γέμισε.':'Δεν αποθηκεύτηκε. Δοκίμασε ξανά.');return false}}
let tT;function toast(t,undo){const el=$('toast');el.querySelector('span').textContent=t;const b=el.querySelector('button');b.style.display=undo?'':'none';b.onclick=()=>{undo();el.style.display='none'};el.style.display='flex';clearTimeout(tT);tT=setTimeout(()=>el.style.display='none',5000)}

document.addEventListener('click',async e=>{
 const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id;
 if(a==='add'){S.pre=b.dataset.date||'';if(!db)return toast('Η αποθήκευση δεν είναι διαθέσιμη.');openForm(!S.projects.length?'project':(b.dataset.kind||'tx'),null,b.dataset.type)}
 else if(a==='share'){e.preventDefault();e.stopPropagation();if(db)openShare(id)}
 else if(a==='switch')openForm(b.dataset.kind);else if(a==='edit'){e.preventDefault();openForm(b.dataset.kind,id)}else if(a==='close')dlg.close();
 else if(a==='toggle'){const t=S.tasks.find(x=>x.id===id);if(t)try{await db.collection('tasks').doc(id).update({done:!t.done,doneAt:t.done?0:Date.now()})}catch{toast('Δεν αποθηκεύτηκε.')}}
 else if(a==='pdel'){e.preventDefault();e.stopPropagation();askDelProject(id)}
 else if(a==='pdelok'){dlg.close();delProject(id)}
 else if(a==='del'&&F.col==='projects'){askDelProject(F.id)}
 else if(a==='del'){const {col,id:did}=F,old=S[col].find(x=>x.id===did);if(!old)return;const {id:_,...keep}=old;dlg.close();
  try{await db.collection(col).doc(did).delete();if(col==='projects')location.hash='projects';toast('Διαγράφηκε',()=>save(col,did,keep))}catch{toast('Δεν διαγράφηκε.')}}
 else if(a==='tf'){S.tf=id;render()}else if(a==='mf'){S.mf=id;render()}else if(a==='month'){S.month=mShift(S.month,+b.dataset.d);render()}
 else if(a==='cm'){S.cm=b.dataset.d==='0'?today().slice(0,7):mShift(S.cm,+b.dataset.d);S.cd=b.dataset.d==='0'?today():S.cm+'-01';render()}
 else if(a==='cnav'){const d=+b.dataset.d,v=S.cv||'week';S.cd=d===0?today():v==='day'?addDays(S.cd,d):v==='week'?addDays(S.cd,7*d):mShift(S.cd.slice(0,7),d)+'-01';render()}
 else if(a==='cview'){if(b.dataset.v){S.cv=b.dataset.v;render()}}
 else if(a==='cday'){S.cd=b.dataset.d;S.cv='day';render()}
 else if(a==='pstat'){e.preventDefault();try{await db.collection('projects').doc(id).update({status:b.dataset.s});toast('Το project είναι πάλι ενεργό')}catch{toast('Δεν αποθηκεύτηκε.')}}
 else if(a==='cd'){S.cd=b.dataset.d;render();document.getElementById('dayp')?.scrollIntoView({behavior:'smooth',block:'nearest'})}
 else if(a==='bg')$('bgfile').click();
 else if(a==='settings')APP.settings(dlg,toast);
});
document.addEventListener('dragstart',e=>{const c=e.target.closest('[data-pid]');if(c){e.dataTransfer.setData('text/plain',c.dataset.pid);e.dataTransfer.effectAllowed='move'}});
document.addEventListener('dragover',e=>{const c=e.target.closest('[data-drop]');if(c){e.preventDefault();document.querySelectorAll('.col.over').forEach(x=>x!==c&&x.classList.remove('over'));c.classList.add('over')}});
document.addEventListener('dragleave',e=>{const c=e.target.closest('[data-drop]');if(c&&!c.contains(e.relatedTarget))c.classList.remove('over')});
document.addEventListener('drop',async e=>{const c=e.target.closest('[data-drop]');if(!c)return;e.preventDefault();c.classList.remove('over');const pid=e.dataTransfer.getData('text/plain'),p=proj(pid);
 if(p&&p.status!==c.dataset.drop)try{await db.collection('projects').doc(pid).update({status:c.dataset.drop});toast(`${p.name}: ${STATUS[c.dataset.drop]}`)}catch{toast('Δεν αποθηκεύτηκε.')}});
$('q').addEventListener('input',e=>{S.q=e.target.value.trim().toLowerCase();render()});
window.addEventListener('hashchange',()=>{if(S.q){S.q='';$('q').value=''}render();scrollTo(0,0)});
function applyBg(){let u=null;try{u=localStorage.getItem('bg')}catch{}const s=$('scene');s.classList.toggle('photo',!!u);s.style.backgroundImage=u?`url("${u}")`:''}
$('bgfile').addEventListener('change',e=>{const f=e.target.files[0];if(!f)return;const img=new Image();img.onload=()=>{const k=Math.min(1,1800/Math.max(img.width,img.height)),c=document.createElement('canvas');c.width=img.width*k;c.height=img.height*k;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
 let prev=null;try{prev=localStorage.getItem('bg')}catch{}try{localStorage.setItem('bg',c.toDataURL('image/jpeg',.8));applyBg();toast('Το φόντο άλλαξε σε αυτή τη συσκευή',()=>{try{prev?localStorage.setItem('bg',prev):localStorage.removeItem('bg')}catch{}applyBg()})}catch{toast('Η εικόνα δεν αποθηκεύτηκε σε αυτή τη συσκευή')}URL.revokeObjectURL(img.src)};img.src=URL.createObjectURL(f);e.target.value=''});
applyBg();

if(CFG.env==='dev')document.querySelector('.bname').insertAdjacentHTML('beforeend','<span class="envtag" style="margin:4px 0 0;align-self:flex-start">DEV</span>');
APP.start(d=>{db=d;
 COLS.forEach(c=>db.collection(c).onSnapshot(s=>{S[c]=s.docs.map(x=>{const o={id:x.id,...x.data()};if(o.type==='invest'){o.type='out';o.by='me'}return o});recon();S.ready=true;if(!dlg.open)render()}));
 dlg.addEventListener('close',render);render();
},e=>{msg.textContent='Πρόβλημα φόρτωσης δεδομένων: '+(e.message||e);S.ready=true;render()});
render();
}
</script>
</body></html>
